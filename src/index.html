<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Kingdom Come: Deliverance 2 RP Brasil | Kingdom RP BRASIL</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0d0b" />
    <meta name="color-scheme" content="dark" />
    <!-- Description, keywords, social cards and structured data are written by the Seo service (src/app/core/seo.ts)
       while the site is prerendered, from src/site.config.json. -->
    <!-- The opening's picture is the largest thing on the page: ask for it before the page has finished building. -->
    <link
      rel="preload"
      as="image"
      href="img/banner-1920.webp"
      fetchpriority="high"
      imagesizes="(max-width: 40rem) 296vw, 100vw"
      imagesrcset="img/banner-960.webp 960w, img/banner-1920.webp 1920w"
    />
    <!-- The clouds of the entrance (shared/ui/curtain): the first thing seen, so they are asked for at once. -->
    <link
      rel="preload"
      as="image"
      href="img/cloud-a-1774.webp"
      media="(prefers-reduced-motion: no-preference)"
    />
    <link
      rel="preload"
      as="image"
      href="img/cloud-b-1375.webp"
      media="(prefers-reduced-motion: no-preference)"
    />
    <!-- The players online are read from the server list in the visitor's browser (src/app/core/server-status.ts). -->
    <link rel="preconnect" href="https://masterlist.mafiahub.dev" crossorigin />
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <!-- With no scripts the clouds of the entrance would never open: there is no curtain then (shared/ui/curtain). -->
    <noscript
      ><style>
        app-curtain {
          display: none;
        }
      </style></noscript
    >
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
