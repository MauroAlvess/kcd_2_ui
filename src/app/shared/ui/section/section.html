<section
  class="section"
  [class.dark]="tone() === 'dark'"
  [class.light]="tone() === 'light'"
  [id]="anchor()"
  [attr.aria-labelledby]="labelledBy()"
>
  @if (image(); as photo) {
    <div class="photo" aria-hidden="true">
      <img
        [src]="photo.src"
        [attr.srcset]="photo.srcset"
        sizes="100vw"
        [style.object-position]="photo.position"
        alt=""
        loading="lazy"
        decoding="async"
      />
    </div>
  }
  <ng-content select="[backdrop]" />
  <div class="wrap" [class.card]="tone() === 'light'">
    @if (tone() === 'light') {
      <div class="frame" aria-hidden="true">
        <img
          class="corner lion"
          src="img/corner-lion.webp"
          width="360"
          height="360"
          alt=""
          loading="lazy"
          decoding="async"
        />
        <img
          class="corner raven"
          src="img/corner-raven.webp"
          width="360"
          height="360"
          alt=""
          loading="lazy"
          decoding="async"
        />
      </div>
    }
    <ng-content />
  </div>
</section>
