<section
  class="section"
  [class.paper]="tone() === 'paper'"
  [class.night]="tone() === 'night'"
  [id]="anchor()"
  [attr.aria-labelledby]="labelledBy()"
>
  @if (tone() === 'paper') {
    <img
      class="print"
      src="img/paper-photo.webp"
      width="1280"
      height="720"
      alt=""
      aria-hidden="true"
      loading="lazy"
      decoding="async"
    />
    <img
      class="rope"
      src="img/rope.webp"
      width="900"
      height="47"
      alt=""
      aria-hidden="true"
      loading="lazy"
      decoding="async"
    />
  }
  @if (image(); as photo) {
    <div class="photo" aria-hidden="true" [style.--tint]="photo.tint ?? 0.85">
      <img
        [src]="photo.src"
        [attr.srcset]="photo.srcset"
        sizes="100vw"
        [style.object-position]="photo.position"
        alt=""
        loading="lazy"
        decoding="async"
      />
    </div>
  }
  @if (corner() === 'lion') {
    <img
      class="corner lion"
      src="img/corner-lion.webp"
      width="360"
      height="360"
      alt=""
      aria-hidden="true"
      loading="lazy"
      decoding="async"
    />
  }
  @if (corner() === 'raven') {
    <img
      class="corner raven"
      src="img/corner-raven.webp"
      width="360"
      height="360"
      alt=""
      aria-hidden="true"
      loading="lazy"
      decoding="async"
    />
  }
  <ng-content select="[backdrop]" />
  <div class="wrap">
    <ng-content />
  </div>
</section>
