<section
  class="section"
  [class.dark]="dark()"
  [id]="anchor()"
  [attr.aria-labelledby]="labelledBy()"
>
  @if (image(); as photo) {
    <div class="photo" aria-hidden="true">
      <img
        [src]="photo.src"
        [attr.srcset]="photo.srcset"
        sizes="100vw"
        [style.object-position]="photo.position"
        alt=""
        loading="lazy"
        decoding="async"
      />
    </div>
  }
  @if (corner() === 'lion') {
    <img
      class="corner lion"
      src="img/corner-lion.webp"
      width="360"
      height="360"
      alt=""
      aria-hidden="true"
      loading="lazy"
      decoding="async"
    />
  }
  @if (corner() === 'raven') {
    <img
      class="corner raven"
      src="img/corner-raven.webp"
      width="360"
      height="360"
      alt=""
      aria-hidden="true"
      loading="lazy"
      decoding="async"
    />
  }
  <ng-content select="[backdrop]" />
  <div class="wrap">
    <ng-content />
  </div>
</section>
