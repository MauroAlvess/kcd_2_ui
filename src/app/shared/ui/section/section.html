<section
  class="section"
  [class.dark]="tone() === 'dark'"
  [class.light]="tone() === 'light'"
  [id]="anchor()"
  [attr.aria-labelledby]="labelledBy()"
>
  @if (image(); as photo) {
    <div class="photo" aria-hidden="true">
      <img
        [src]="photo.src"
        [attr.srcset]="photo.srcset"
        sizes="100vw"
        [style.object-position]="photo.position"
        alt=""
        loading="lazy"
        decoding="async"
      />
    </div>
  }
  @if (tone() === 'light') {
    <div class="frame" aria-hidden="true">
      <img
        class="corner lion"
        src="img/corner-lion.webp"
        width="360"
        height="360"
        alt=""
        loading="lazy"
        decoding="async"
      />
      <img
        class="corner raven"
        src="img/corner-raven.webp"
        width="360"
        height="360"
        alt=""
        loading="lazy"
        decoding="async"
      />
    </div>
  }
  @if (tone() === 'dark' && !image()) {
    <div class="fog" aria-hidden="true">
      <img
        class="cloud high"
        src="img/cloud-a-1774.webp"
        width="1774"
        height="887"
        alt=""
        loading="lazy"
        decoding="async"
      />
      <img
        class="cloud low"
        src="img/cloud-b-1375.webp"
        width="1375"
        height="1144"
        alt=""
        loading="lazy"
        decoding="async"
      />
    </div>
  }
  <ng-content select="[backdrop]" />
  <div class="wrap">
    <ng-content />
  </div>
</section>
