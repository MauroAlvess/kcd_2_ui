<app-section anchor="guildas" tone="light" labelledBy="guildas-title">
  <app-section-heading
    numeral="III"
    eyebrow="Guildas"
    heading="Ninguém vive só de espada"
    titleId="guildas-title"
  >
    Forja, caça, taverna, alquimia e agulha: cinco guildas movem a economia do reino, cada uma com
    as suas receitas e os seus segredos.
  </app-section-heading>

  <ul class="grid">
    @for (guild of guilds; track guild.id) {
      <li class="reveal">
        <app-guild-card [guild]="guild" />
      </li>
    }
  </ul>
</app-section>
