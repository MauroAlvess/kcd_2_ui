<app-section anchor="guildas" labelledBy="guildas-title" corner="lion">
  <app-section-heading
    eyebrow="Guildas"
    icon="shield"
    heading="Ninguém vive só de espada"
    titleId="guildas-title"
  >
    Forja, caça, taverna, alquimia, agulha, machado, enxada e rédea: oito guildas movem a economia
    do reino. Escolha a sua e faça o reino depender de você.
  </app-section-heading>

  <ul class="grid">
    @for (guild of guilds; track guild.id) {
      <li [appReveal]="$index % 4">
        <app-guild-card [guild]="guild" />
      </li>
    }
  </ul>
</app-section>
