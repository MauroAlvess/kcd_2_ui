<app-section anchor="guildas" tone="dark" labelledBy="guildas-title">
  <app-section-heading
    eyebrow="Guildas"
    icon="shield"
    heading="Ninguém vive só de espada"
    titleId="guildas-title"
  >
    Forja, caça, taverna, alquimia, agulha, machado, enxada e rédea: oito guildas movem a economia
    do reino, cada uma com as suas receitas e os seus segredos.
  </app-section-heading>

  <ul class="grid">
    @for (guild of guilds; track guild.id) {
      <li>
        <app-guild-card [guild]="guild" />
      </li>
    }
  </ul>
</app-section>
