<app-section anchor="guildas" tone="light" labelledBy="guildas-title">
  <app-section-heading eyebrow="Guildas" heading="Escolha sua guilda" titleId="guildas-title">
    Cinco ofícios, cinco guildas. Escolha uma e receba o que precisa para começar.
  </app-section-heading>

  <ul class="grid">
    @for (guild of guilds; track guild.id) {
      <li class="reveal">
        <app-guild-card [guild]="guild" />
      </li>
    }
  </ul>
</app-section>
