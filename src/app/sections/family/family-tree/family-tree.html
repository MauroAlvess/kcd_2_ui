<ng-template #branch let-node>
  <li>
    <div class="unit">
      @for (person of node.people; track person.label) {
        <span class="person" [class.you]="person.you">{{ person.label }}</span>
      }
    </div>
    @if (node.children?.length) {
      <ul>
        @for (child of node.children; track child.id) {
          <ng-container
            [ngTemplateOutlet]="branch"
            [ngTemplateOutletContext]="{ $implicit: child }"
          />
        }
      </ul>
    }
  </li>
</ng-template>

<div class="scroll">
  <ul class="tree" aria-label="Exemplo de árvore genealógica, dos avós aos netos">
    <ng-container [ngTemplateOutlet]="branch" [ngTemplateOutletContext]="{ $implicit: tree }" />
  </ul>
</div>
