<app-section anchor="familia" tone="dark" labelledBy="familia-title">
  <div class="layout">
    <div class="text">
      <app-section-heading
        align="start"
        eyebrow="Família"
        heading="Crie sua família"
        titleId="familia-title"
      >
        Monte a sua árvore genealógica e deixe um nome para a história.
      </app-section-heading>

      <ul class="points">
        @for (point of points; track point) {
          <li>{{ point }}</li>
        }
      </ul>
    </div>

    <div class="tree reveal">
      <app-family-tree />
      <p class="note">{{ note }}</p>
    </div>
  </div>
</app-section>
