<app-section anchor="familia" labelledBy="familia-title">
  <div class="layout">
    <div class="text">
      <app-section-heading
        eyebrow="Família"
        icon="tree"
        heading="Seu nome vai durar mais que você"
        titleId="familia-title"
      >
        Case, tenha herdeiros, adote, reconheça um bastardo. A sua árvore cresce por gerações e
        herda tudo: terras, títulos e inimigos.
      </app-section-heading>

      <ul class="points">
        @for (point of points; track point) {
          <li [appReveal]="$index + 1">{{ point }}</li>
        }
      </ul>
    </div>

    <div class="tree" [appReveal]="1">
      <img
        class="emblem"
        src="img/tree-crest.webp"
        width="440"
        height="293"
        alt=""
        loading="lazy"
        decoding="async"
      />
      <app-family-tree />
      <p class="note">{{ note }}</p>
    </div>
  </div>
</app-section>
