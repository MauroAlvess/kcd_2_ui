<div class="holdings" id="propriedades">
  <h3 class="title">{{ title }}</h3>
  <p class="intro">{{ intro }}</p>
  <ul class="grid">
    @for (holding of holdings; track holding.id) {
      <li class="reveal">
        <article class="card">
          <img
            class="crest"
            [src]="'img/' + holding.crest"
            width="300"
            [height]="holding.crestHeight"
            [alt]="holding.crestAlt"
            loading="lazy"
            decoding="async"
          />
          <h4>{{ holding.title }}</h4>
          <p class="subtitle">{{ holding.subtitle }}</p>
          <ul class="points">
            @for (point of holding.points; track point) {
              <li>{{ point }}</li>
            }
          </ul>
        </article>
      </li>
    }
  </ul>
</div>
