<app-section anchor="entrar" labelledBy="entrar-title" dark>
  <div backdrop class="scene" aria-hidden="true">
    <img
      src="img/join-1920.webp"
      srcset="img/join-960.webp 960w, img/join-1920.webp 1920w"
      sizes="100vw"
      width="1920"
      height="1080"
      alt=""
      loading="lazy"
      decoding="async"
    />
  </div>

  <div class="card">
    <app-section-heading eyebrow="Entrar" heading="Sua lenda começa hoje" titleId="entrar-title">
      {{ site.game }}, RP Brasil: o primeiro servidor de roleplay de KCD 2 (Deliverance 2) do
      Brasil, e totalmente gratuito. Três passos separam você de Kuttenberg.
    </app-section-heading>

    <div appReveal>
      <app-steps [steps]="steps" />
    </div>

    <div class="cta" [appReveal]="1">
      <div class="actions">
        <app-button [href]="site.discord" icon="chat" external large>Entrar no Discord</app-button>
        <app-button [href]="site.launcher" variant="ghost" icon="download" large>
          Baixar launcher
        </app-button>
      </div>
      <app-server-badge />
    </div>
  </div>
</app-section>
