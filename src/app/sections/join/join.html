<app-section anchor="entrar" tone="light" labelledBy="entrar-title">
  <div class="card">
    <app-section-heading
      eyebrow="Bem-vindo"
      heading="Sejam todos bem-vindos"
      titleId="entrar-title"
    >
      {{ site.game }} — RP Brasil, o primeiro servidor de RP de KCD 2 do Brasil.
    </app-section-heading>

    <app-steps [steps]="steps" />

    <div class="cta">
      <app-button [href]="site.discord" external>Entrar no Discord</app-button>
      <app-server-badge />
    </div>
  </div>
</app-section>
