<app-section anchor="entrar" tone="dark" labelledBy="entrar-title" [image]="painting">
  <div class="card">
    <img
      class="welcome"
      src="img/bene-advenisti-866.webp"
      srcset="img/bene-advenisti-440.webp 440w, img/bene-advenisti-866.webp 866w"
      sizes="(min-width: 40rem) 23rem, 70vw"
      width="866"
      height="237"
      alt="Bene advenisti, bem-vindo em latim, bordado em vermelho e creme"
      loading="lazy"
      decoding="async"
    />
    <app-section-heading
      eyebrow="Entrar"
      icon="enter"
      heading="Sua lenda começa hoje"
      titleId="entrar-title"
    >
      {{ site.game }}, RP Brasil: o primeiro servidor de RP de KCD 2 do Brasil. Três passos separam
      você de Kuttenberg.
    </app-section-heading>

    <app-steps [steps]="steps" />

    <div class="cta">
      <app-button [href]="site.discord" icon="chat" external large>Entrar no Discord</app-button>
      <app-server-badge />
    </div>
  </div>
</app-section>
