<figure class="shot reveal">
  <button class="open" type="button" (click)="opened.emit()">
    <img
      [src]="shot().small.src"
      [attr.width]="shot().small.width"
      [attr.height]="shot().small.height"
      [alt]="shot().alt"
      loading="lazy"
      decoding="async"
    />
    <span class="zoom" aria-hidden="true">Ampliar</span>
    <span class="sr-only">Ampliar a imagem: {{ shot().title }}</span>
  </button>
  <figcaption>
    <h4>{{ shot().title }}</h4>
    <p>{{ shot().text }}</p>
  </figcaption>
</figure>
