<figure class="clip reveal">
  <div class="frame">
    <video
      #video
      controls
      playsinline
      preload="none"
      [attr.poster]="clip().poster.src"
      [attr.width]="clip().poster.width"
      [attr.height]="clip().poster.height"
      [attr.aria-label]="clip().title + ': ' + clip().text"
      (play)="played.emit()"
    >
      <source [attr.src]="clip().file" type="video/mp4" />
      O seu navegador não toca este vídeo. <a [href]="clip().file">Baixe o arquivo</a>.
    </video>
  </div>
  <figcaption>
    <h4>{{ clip().title }}</h4>
    <span class="length"><span class="sr-only">Duração: </span>{{ clip().length }}</span>
    <p>{{ clip().text }}</p>
  </figcaption>
</figure>
