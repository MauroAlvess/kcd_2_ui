<app-section anchor="midias" tone="dark" labelledBy="midias-title">
  <app-section-heading eyebrow="Mídias" heading="Cenas do reino" titleId="midias-title">
    O servidor como os jogadores o vivem.
  </app-section-heading>

  <div class="clips">
    @for (clip of clips; track clip.id; let first = $first) {
      <app-clip-card [clip]="clip" [featured]="first" (played)="pauseOthers(clip.id)" />
    }
  </div>

  <div class="shots">
    @for (shot of shots; track shot.id; let index = $index) {
      <app-shot-card [shot]="shot" (opened)="viewer.show(index)" />
    }
  </div>

  <app-lightbox #viewer [pictures]="pictures" />
</app-section>
