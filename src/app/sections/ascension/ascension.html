<app-section anchor="ascensao" tone="dark" labelledBy="ascensao-title" [image]="photo">
  <app-section-heading eyebrow="Ascensão" heading="Do plebeu ao nobre" titleId="ascensao-title">
    Todos começam como plebeus. Crie alianças, faça amigos e cresça: tudo depende de você e dos seus
    feitos.
  </app-section-heading>

  <app-steps [steps]="ranks" />

  <p class="rule reveal">{{ rule }}</p>

  <p class="or reveal">
    Ou simplesmente vire o maior arqueiro, ou o maior cavaleiro, de todo o reino.
  </p>
</app-section>
