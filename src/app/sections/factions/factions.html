<app-section anchor="faccoes" tone="dark" labelledBy="faccoes-title">
  <app-section-heading eyebrow="Facções" heading="Leão ou Corvo?" titleId="faccoes-title">
    Duas facções disputam o futuro do reino. Você vai jurar lealdade a uma delas, e viver com a
    escolha.
  </app-section-heading>

  <div class="houses">
    @for (house of houses; track house.id) {
      <app-house-card [house]="house" />
    }
  </div>
</app-section>
