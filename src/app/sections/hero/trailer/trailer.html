<a class="card" [href]="watch" target="_blank" rel="noopener" (click)="open($event)">
  <span class="thumb">
    <img
      [src]="trailer.large.src"
      [attr.srcset]="trailer.small.src + ' 640w, ' + trailer.large.src + ' 1280w'"
      sizes="(min-width: 70rem) 28rem, 90vw"
      [attr.width]="trailer.large.width"
      [attr.height]="trailer.large.height"
      alt=""
      loading="lazy"
      decoding="async"
    />
    <span class="new">Novo</span>
    <span class="play" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="30" height="30">
        <path d="M8 5.5v13l11-6.5z" fill="currentColor" />
      </svg>
    </span>
  </span>
  <span class="text">
    <span class="kicker">Primeiro trailer do servidor</span>
    <span class="title">{{ trailer.title }}</span>
    <span class="watch">
      Assistir agora
      <span class="length"><span class="sr-only">Duração: </span>{{ trailer.length }}</span>
    </span>
  </span>
</a>

<dialog
  #dialog
  class="player"
  aria-label="Trailer do servidor"
  (click)="margin($event)"
  (close)="stop()"
>
  @if (playing()) {
    <div class="frame">
      <iframe
        [src]="embed"
        title="Kingdom RP BRASIL: trailer de revelação"
        allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
        allowfullscreen
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
    </div>
  }
  <button class="close" type="button" autofocus (click)="close()">Fechar</button>
</dialog>
