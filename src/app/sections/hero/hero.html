<section class="hero" id="inicio" aria-labelledby="hero-title">
  <div class="media" aria-hidden="true">
    <img
      class="still"
      src="img/banner-1920.webp"
      srcset="img/banner-960.webp 960w, img/banner-1920.webp 1920w"
      sizes="(max-width: 40rem) 296vw, 100vw"
      width="1920"
      height="1080"
      fetchpriority="high"
      alt=""
    />
  </div>

  <div class="content">
    <h1 id="hero-title" class="server">Kingdom Come: Deliverance II RP Brasil</h1>
    <p class="claim">O rei morreu. <span>A coroa de Kuttenberg está vaga.</span></p>
    <p class="tagline">
      Comece plebeu. Domine um ofício, funde uma família, conquiste terras e título. Em Kuttenberg,
      quem não sobe, serve.
    </p>
    <div class="actions">
      <app-button [href]="site.discord" icon="chat" external large>Entrar no Discord</app-button>
      <app-button [href]="site.launcher" variant="ghost" icon="download" large>
        Baixar launcher
      </app-button>
    </div>
    <app-server-badge class="live" />
  </div>
</section>
