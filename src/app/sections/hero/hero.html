<section class="hero" id="inicio" aria-labelledby="hero-title">
  <div class="media" aria-hidden="true">
    <img
      class="still"
      src="img/hero-1920.webp"
      srcset="img/hero-960.webp 960w, img/hero-1920.webp 1920w"
      sizes="100vw"
      width="1920"
      height="1080"
      fetchpriority="high"
      alt=""
    />
  </div>

  <div class="content">
    <h1 id="hero-title">
      <span class="game">Kingdom Come: Deliverance II</span>
      <span class="name">RP Brasil</span>
    </h1>
    <p class="claim">O rei está morto. A coroa de Kuttenberg espera um nome.</p>
    <p class="tagline">
      O primeiro servidor de roleplay de KCD 2 (Deliverance 2) do Brasil. Jure lealdade, erga a sua
      família e escreva o seu nome na história da Boêmia.
    </p>
    <div class="actions">
      <app-button [href]="site.discord" external large>Entrar no Discord</app-button>
      <app-button [href]="site.launcher" variant="ghost" large>Baixar launcher</app-button>
    </div>
    <app-server-badge class="live" />
  </div>
</section>
