<section class="hero" id="inicio" aria-labelledby="hero-title">
  <div class="photo" aria-hidden="true">
    <img
      src="img/scene-cidade-1920.webp"
      srcset="img/scene-cidade-960.webp 960w, img/scene-cidade-1920.webp 1920w"
      sizes="100vw"
      width="1920"
      height="1080"
      fetchpriority="high"
      alt=""
    />
  </div>

  <div class="content">
    <div class="copy">
      <img
        class="crest"
        src="img/logo.webp"
        width="320"
        height="501"
        alt="Emblema do Kingdom RP BRASIL: as iniciais KCD e o II sob uma coroa, com Roleplay Brasileiro no arco"
      />
      <h1 id="hero-title">
        <span class="game">Kingdom Come: Deliverance II</span>
        <span class="name">RP Brasil</span>
      </h1>
      <p class="tagline">O primeiro servidor de roleplay de KCD 2 (Deliverance 2) do Brasil.</p>
      <div class="actions">
        <app-button [href]="site.discord" external>Entrar no Discord</app-button>
      </div>
      <app-server-badge class="live" />
    </div>
  </div>
</section>
