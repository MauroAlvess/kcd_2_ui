<section class="hero" id="inicio" aria-labelledby="hero-title">
  <div class="photo" aria-hidden="true">
    <img
      src="img/scene-cidade-1920.webp"
      srcset="img/scene-cidade-960.webp 960w, img/scene-cidade-1920.webp 1920w"
      sizes="100vw"
      width="1920"
      height="1080"
      fetchpriority="high"
      alt=""
    />
  </div>

  <div class="content">
    <img
      class="crest"
      src="img/logo.webp"
      width="320"
      height="320"
      alt="Brasão do Kingdom Leon &amp; Crow: um leão dourado e um corvo"
    />
    <h1 id="hero-title">
      <span class="game">Kingdom Come: Deliverance II</span>
      <span class="name">RP Brasil</span>
    </h1>
    <span class="bar" aria-hidden="true"></span>
    <p class="tagline">O primeiro servidor de roleplay de KCD 2 do Brasil.</p>
    <p class="story">
      Boêmia, 1403. Duas casas em guerra, uma Marca sem senhor e um documento que ninguém encontra.
      De que lado você vai estar?
    </p>
    <div class="actions">
      <app-button [href]="site.discord" external>Entrar no Discord</app-button>
      <app-button variant="ghost" href="#guildas">Conhecer o reino</app-button>
    </div>
    <p class="note">Acesso por whitelist, direto no Discord</p>
  </div>
</section>
