<section id="faccoes" class="houses" aria-labelledby="faccoes-title">
  <div class="wrap">
    <header class="head">
      <p class="lb rv eyebrow">{{ eyebrow }}</p>
      <h2 id="faccoes-title" class="hd rv title">
        {{ title }} <em>{{ titleEm }}</em>
      </h2>
      <p class="rv lead">{{ lead }}</p>
    </header>

    <div class="pair">
      @for (house of houses; track house.id) {
        <article class="house rv" [attr.data-house]="house.id">
          <p class="lb label">{{ house.label }}</p>
          <img
            class="crest"
            [src]="'img/' + house.crest"
            [alt]="house.alt"
            width="500"
            height="500"
            loading="lazy"
            decoding="async"
          />
          <h3 class="hd name">
            {{ house.name }} <em>{{ house.nameEm }}</em>
          </h3>
          <p class="text">{{ house.text }}</p>
        </article>
      }
    </div>
  </div>
</section>
