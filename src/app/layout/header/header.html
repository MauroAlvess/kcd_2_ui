<header class="bar" [class.solid]="scrolled()">
  <div class="wrap inner">
    <a class="brand" href="#topo" aria-label="Kingdom RP Brasil, início">
      <img class="crest" src="img/logo-rp.webp" width="256" height="253" alt="" />
      <span class="names">
        <span class="lb game">Kingdom Come: Deliverance II</span>
        <span class="ct name">Kingdom RP Brasil</span>
      </span>
    </a>

    <p class="place" aria-hidden="true">
      <span class="town"><i></i><span class="lb">Kuttenberg</span></span>
      <span class="lb year">Anno Domini 1403</span>
    </p>

    <div class="buttons">
      <app-button class="launcher" [href]="site.launcher" variant="ghost" small
        >Launcher</app-button
      >
      <app-button [href]="site.discord" external small>Discord</app-button>
    </div>
  </div>
</header>
