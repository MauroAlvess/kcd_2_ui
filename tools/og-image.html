<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Imagem de compartilhamento</title>
    <!-- Rendered to public/og-image-3.jpg by tools/make-og-image.py: 1200 x 630, the size chat apps and search results want.
         It is the opening of the page as it is now (2026-10-25): the picture of the duel in the tourney yard (public/img/hero-1920.webp),
         darkened on the left, the lettering of the server's name (public/img/title-1280.webp) and the line of the story under it in the
         site's own serif, flat, with no frame. -->
    <style>
      @font-face {
        font-family: 'EB Garamond';
        font-weight: 400;
        src: url('../node_modules/@fontsource/eb-garamond/files/eb-garamond-latin-400-normal.woff2')
          format('woff2');
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
        background: #0f0d0b;
      }

      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        color: #ece6da;
      }

      .photo {
        position: absolute;
        inset: 0;
        background: url('../public/img/hero-1920.webp') 62% 45% / cover;
      }

      /* The same two shades as the opening of the page: dark on the left where the words are, and at the foot and the top. */
      .shade {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            to right,
            rgba(15, 13, 11, 0.9),
            rgba(15, 13, 11, 0.7) 32%,
            rgba(15, 13, 11, 0.3) 56%,
            rgba(15, 13, 11, 0.04) 78%
          ),
          linear-gradient(
            to bottom,
            rgba(15, 13, 11, 0.68),
            transparent 20%,
            transparent 66%,
            rgba(15, 13, 11, 0.72)
          );
      }

      .brand {
        position: absolute;
        top: 52px;
        left: 72px;
        display: flex;
        align-items: center;
        gap: 16px;
        font:
          400 30px/1.1 'EB Garamond',
          serif;
      }

      .brand img {
        width: auto;
        height: 58px;
      }

      .content {
        position: absolute;
        left: 72px;
        bottom: 66px;
        width: 760px;
      }

      .title {
        display: block;
        width: 540px;
        height: auto;
        filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.5));
      }

      .claim {
        margin-top: 24px;
        font:
          400 40px/1.25 'EB Garamond',
          serif;
        text-wrap: balance;
        text-shadow: 0 1px 14px rgba(0, 0, 0, 0.6);
      }

      .address {
        position: absolute;
        right: 72px;
        bottom: 66px;
        font:
          500 22px/1.3 'Segoe UI',
          system-ui,
          sans-serif;
        color: rgba(236, 230, 218, 0.85);
        text-shadow: 0 1px 10px rgba(0, 0, 0, 0.7);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="photo"></div>
      <div class="shade"></div>
      <div class="brand">
        <img src="../public/img/logo.webp" alt="" />
        <span>Kingdom RP Brasil</span>
      </div>
      <div class="content">
        <img class="title" src="../public/img/title-1280.webp" alt="" />
        <div class="claim">O rei está morto.<br />A coroa de Kuttenberg espera um nome.</div>
      </div>
      <div class="address">kingdomrpbrasil.com.br</div>
    </div>
  </body>
</html>
