<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Imagem de compartilhamento</title>
    <!-- Rendered to public/og-image-4.jpg by tools/make-og-image.py: 1200 x 630, the size chat apps and search results want.
         It is the banner of the page (2026-10-28, public/img/banner-1920.webp: the battle before the castle, with the server's name
         and crest in gold already on it), whole, and the address of the site at its foot in the site's own serif, flat, with no frame. -->
    <style>
      @font-face {
        font-family: 'EB Garamond';
        font-weight: 400;
        src: url('../node_modules/@fontsource/eb-garamond/files/eb-garamond-latin-400-normal.woff2')
          format('woff2');
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
        background: #00062f;
      }

      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        color: #ece6da;
      }

      .photo {
        position: absolute;
        inset: 0;
        background: url('../public/img/banner-1920.webp') 50% 50% / cover;
      }

      .address {
        position: absolute;
        right: 0;
        bottom: 34px;
        left: 0;
        text-align: center;
        font:
          400 30px/1.2 'EB Garamond',
          serif;
        letter-spacing: 0.04em;
        color: #e7af36;
        text-shadow: 0 1px 12px rgba(0, 6, 47, 0.9);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="photo"></div>
      <div class="address">kingdomrpbrasil.com.br</div>
    </div>
  </body>
</html>
