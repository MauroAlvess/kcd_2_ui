<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Imagem de compartilhamento</title>
    <!-- Rendered to public/og-image.jpg by tools/make-og-image.py: 1200 x 630, the size chat apps and search results want.
         The picture is the still of the opening's video (Kuttenberg on its hill, public/img/hero-poster-1920.webp), framed
         like the page and the game's panel, with the lion and the raven in the corners. -->
    <style>
      @font-face {
        font-family: 'Cinzel';
        font-weight: 600;
        src: url('../node_modules/@fontsource/cinzel/files/cinzel-latin-600-normal.woff2')
          format('woff2');
      }

      @font-face {
        font-family: 'EB Garamond';
        font-style: italic;
        src: url('../node_modules/@fontsource/eb-garamond/files/eb-garamond-latin-400-italic.woff2')
          format('woff2');
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
        background: #0d0b09;
      }

      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        color: #eee4cf;
      }

      .photo {
        position: absolute;
        inset: 0;
        background: url('../public/img/hero-poster-1920.webp') 60% 38% / cover;
        filter: sepia(0.2) saturate(0.9) contrast(1.06) brightness(0.92);
      }

      .shade {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            90deg,
            rgba(13, 11, 9, 0.94) 0%,
            rgba(13, 11, 9, 0.78) 46%,
            rgba(13, 11, 9, 0.22) 100%
          ),
          linear-gradient(to top, rgba(13, 11, 9, 0.9), transparent 40%);
      }

      .frame {
        position: absolute;
        inset: 22px;
        border: 1px solid rgba(201, 162, 74, 0.5);
        box-shadow:
          inset 0 0 0 6px transparent,
          inset 0 0 0 7px rgba(201, 162, 74, 0.2);
      }

      .corner {
        position: absolute;
        width: 118px;
        height: auto;
        filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.6));
      }

      .lion {
        top: 4px;
        left: 4px;
      }

      .raven {
        right: 4px;
        bottom: 4px;
      }

      .content {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 92px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .game {
        font:
          600 24px/1.2 'Cinzel',
          serif;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        color: #ecd28a;
      }

      .name {
        margin-top: 14px;
        font:
          600 118px/1 'Cinzel',
          serif;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        background: linear-gradient(176deg, #fbeec0 0%, #ecd28a 34%, #c9a24a 58%, #8a6424 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 22px rgba(0, 0, 0, 0.7));
      }

      .ornament {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 30px 0 26px;
      }

      .ornament i {
        width: 70px;
        height: 2px;
        background: linear-gradient(to right, #98090c, rgba(152, 9, 12, 0));
      }

      .ornament i:first-child {
        background: #98090c;
      }

      .ornament b {
        width: 12px;
        height: 12px;
        border: 2px solid #98090c;
        transform: rotate(45deg);
      }

      .tagline {
        max-width: 640px;
        font:
          italic 44px/1.22 'EB Garamond',
          serif;
        text-wrap: balance;
      }

      .tagline span {
        color: #ecd28a;
      }

      .foot {
        margin-top: 34px;
        font:
          600 18px/1.2 'Cinzel',
          serif;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #d2b38c;
      }

      .crest {
        position: absolute;
        top: 50%;
        right: 108px;
        width: auto;
        height: 400px;
        transform: translateY(-50%);
        filter: drop-shadow(0 22px 32px rgba(0, 0, 0, 0.75));
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="photo"></div>
      <div class="shade"></div>
      <div class="frame">
        <img class="corner lion" src="../public/img/corner-lion.webp" alt="" />
        <img class="corner raven" src="../public/img/corner-raven.webp" alt="" />
      </div>
      <div class="content">
        <div class="game">Kingdom Come: Deliverance II</div>
        <div class="name">RP Brasil</div>
        <div class="ornament"><i></i><b></b><i></i></div>
        <div class="tagline">
          O rei está morto. <span>A coroa de Kuttenberg</span> espera um nome.
        </div>
        <div class="foot">Kingdom RP BRASIL · Whitelist pelo Discord</div>
      </div>
      <img class="crest" src="../public/img/logo.webp" alt="" />
    </div>
  </body>
</html>
