<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Imagem de compartilhamento</title>
    <!-- Rendered to public/og-image.jpg by tools/make-og-image.py: 1200 x 630, the size chat apps and search results want. -->
    <style>
      @font-face {
        font-family: 'Cinzel';
        font-weight: 600;
        src: url('../node_modules/@fontsource/cinzel/files/cinzel-latin-600-normal.woff2')
          format('woff2');
      }

      @font-face {
        font-family: 'EB Garamond';
        font-style: italic;
        src: url('../node_modules/@fontsource/eb-garamond/files/eb-garamond-latin-400-italic.woff2')
          format('woff2');
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
        background: #0d0b09;
      }

      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        color: #eee4cf;
      }

      .photo {
        position: absolute;
        inset: 0;
        background: url('../public/img/scene-cidade-1920.webp') 50% 40% / cover;
        filter: sepia(0.2) saturate(0.85);
      }

      .shade {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            90deg,
            rgba(13, 11, 9, 0.95) 0%,
            rgba(13, 11, 9, 0.8) 48%,
            rgba(13, 11, 9, 0.3) 100%
          ),
          linear-gradient(to top, #0d0b09, transparent 38%);
      }

      .frame {
        position: absolute;
        inset: 22px;
        border: 1px solid rgba(210, 179, 140, 0.35);
      }

      .content {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 84px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .game {
        font:
          600 25px/1.2 'Cinzel',
          serif;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        color: #d2b38c;
      }

      .name {
        margin-top: 16px;
        font:
          600 112px/1 'Cinzel',
          serif;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        text-shadow: 0 4px 28px rgba(0, 0, 0, 0.6);
      }

      .bar {
        width: 92px;
        height: 5px;
        margin: 34px 0 30px;
        background: #98090c;
      }

      .tagline {
        max-width: 600px;
        font:
          italic 40px/1.3 'EB Garamond',
          serif;
        text-wrap: balance;
      }

      .foot {
        margin-top: 38px;
        font:
          600 19px/1.2 'Cinzel',
          serif;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #d2b38c;
      }

      .crest {
        position: absolute;
        top: 50%;
        right: 110px;
        width: auto;
        height: 430px;
        transform: translateY(-50%);
        filter: drop-shadow(0 22px 32px rgba(0, 0, 0, 0.65));
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="photo"></div>
      <div class="shade"></div>
      <div class="frame"></div>
      <div class="content">
        <div class="game">Kingdom Come: Deliverance II</div>
        <div class="name">RP Brasil</div>
        <div class="bar"></div>
        <div class="tagline">O primeiro servidor de roleplay de KCD 2 do Brasil.</div>
        <div class="foot">Kingdom RP BRASIL · Whitelist pelo Discord</div>
      </div>
      <img class="crest" src="../public/img/logo.webp" alt="" />
    </div>
  </body>
</html>
